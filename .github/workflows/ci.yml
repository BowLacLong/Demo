name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Kiểm thử (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cài đặt phụ thuộc
        run: npm ci

      - name: Kiểm tra cú pháp JavaScript
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './coverage/*')
          for f in "${files[@]}"; do node --check "$f"; done
          echo "Đã kiểm tra ${#files[@]} tệp JavaScript, không có lỗi cú pháp."

      - name: Chạy test tự động
        run: npm test -- --ci --coverage

      - name: Khởi động thử ứng dụng
        env:
          NODE_ENV: production
          PORT: '3000'
          SESSION_SECRET: ci-only-secret
        run: |
          set -euo pipefail
          npm start > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then break; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)
          echo "GET /login -> $code"
          test "$code" = "200"
          echo "--- server.log ---"
          cat server.log

      - name: Lưu báo cáo độ phủ
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
